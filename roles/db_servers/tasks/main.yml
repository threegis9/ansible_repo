- name: install mariadb server package (Rocky)
  tags: rocky,db,mariadb
  dnf:
    name: mariadb
    state: latest
  when: ansible_facts["distribution"] == "Rocky"

- name: install mariadb server
  tags: db,mariadb,ubuntu
  apt: 
    name: mariadb-server
    state: latest
  when: ansible_facts["distribution"] == "Ubuntu"
  
